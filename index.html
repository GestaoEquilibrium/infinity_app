  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:var(--f-sans); background:var(--bg); color:var(--ink);
    overflow:hidden; -webkit-font-smoothing:antialiased;
    transition:background .4s var(--ease), color .4s var(--ease);
  }
  .mono { font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
  #root { position:relative; z-index:1; height:100vh; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  .glass { background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-1); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:10px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:var(--ink-3); background-clip:padding-box; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-md); }
  @keyframes slideUp { from { transform:translateY(16px); } to { transform:none; } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  @keyframes popIn { from { transform:scale(0.96); } to { transform:none; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  .anim-slide { animation:slideUp .5s var(--ease) both; }
  .anim-fade { animation:fadeIn .4s var(--ease) both; }
